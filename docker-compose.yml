version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: cliniccore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cliniccore}
      POSTGRES_USER: ${DB_USER:-cliniccore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cliniccore_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - cliniccore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cliniccore_user} -d ${DB_NAME:-cliniccore}"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Application (Development)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cliniccore-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-cliniccore_user}:${DB_PASSWORD:-cliniccore_pass}@database:5432/${DB_NAME:-cliniccore}
      PORT: ${APP_PORT:-3000}
      # Add other environment variables as needed
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cliniccore-network
    profiles:
      - dev

  # Application (Production)
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: cliniccore-app-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-cliniccore_user}:${DB_PASSWORD:-cliniccore_pass}@database:5432/${DB_NAME:-cliniccore}
      PORT: ${APP_PORT:-3000}
      # Add other environment variables as needed
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - cliniccore-network
    profiles:
      - prod

  # Redis (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: cliniccore-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cliniccore-network
    command: redis-server --appendonly yes
    profiles:
      - prod

  # Nginx (Production reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: cliniccore-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app-prod
    networks:
      - cliniccore-network
    profiles:
      - prod

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cliniccore-network:
    driver: bridge